<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 2</title>
    <link rel="stylesheet" href="Tarea2.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <header>
        <h1>Tu chute de energía diaria</h1>
        <img src="./imagenes/logo_plusenergy.png">
        <div class="iconos">

            <div class="icono">
                <span class="material-symbols-outlined">login</span>
                <span>Login</span>
            </div>

            <div class="icono">
                <span class="material-symbols-outlined">bolt</span>
                <span>Novedades electrizantes</span>
            </div>

            <div class="icono">
                <span class="material-symbols-outlined">add_shopping_cart</span>
                <span>Carrito</span>
            </div>
            
        </div>
    </header>

    <main>
        <h2>Conoce nuestros sabores más electrizantes</h2>
    </main>

    <main class="contenedor">
        <div class="item_galeria">
            <img src="./imagenes/lata1.png" alt="Imagen 1">
            <p>Mango</p>
        </div>
        <div class="item_galeria">
            <img src="./imagenes/lata2.png" alt="Imagen 2">
            <p>Limón</p>
        </div>
        <div class="item_galeria">
            <img src="./imagenes/lata3.png" alt="Imagen 3">
            <p>Red Berry</p>
        </div>
        <div class="item_galeria">
            <img src="./imagenes/lata4.png" alt="Imagen 4">
            <p>Green Apple</p>
        </div>
        <div class="item_galeria">
            <img src="./imagenes/lata5.png" alt="Imagen 5">
            <p>Blueberry</p>
        </div>
        <div class="item_galeria">
            <img src="./imagenes/lata6.png" alt="Imagen 6">
            <p>Passion Fruit</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PlusEnergy - Galería con Flexbox</p>
    </footer>
</body>
</html>
